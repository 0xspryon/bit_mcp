name: bit-staging

x-app-env: &app-env
  NODE_ENV: production
  ENVIRONMENT: staging

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--auto-truncate"
    environment:
      - HF_HOME=/data
    volumes:
      - tei_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--auto-truncate"
    environment:
      - HF_HOME=/data
    volumes:
      - reranker_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  migrations:
    build:
      context: .
      dockerfile: ./Dockerfile.migrations.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy

  seeds:
    build:
      context: .
      dockerfile: ./Dockerfile.seeds.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
      EMBEDDING_ENDPOINT: http://embeddings:80
      RERANK_ENDPOINT: http://reranker:80
    networks:
      - dokploy-network
    depends_on:
      migrations:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      EMBEDDING_ENDPOINT: http://embeddings:80
      RERANK_ENDPOINT: http://reranker:80
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      # The api and the SPA share ONE public origin, and that is load-bearing
      # rather than tidy: the browser client calls relative `/api/v1/*` URLs,
      # and better-auth issues first-party session cookies plus post-login
      # redirects to `/connect` and `/admin/users` — SPA routes. Split them
      # across two hostnames and every one of those breaks at once.
      #
      # Traefik orders routers by descending priority, and defaults priority to
      # the rule's length, which already favours this router over the SPA's bare
      # Host rule. Both are pinned explicitly so the split never turns on how
      # long a hostname happens to be.
      - traefik.enable=true
      - traefik.http.routers.bit-staging-api.rule=Host(`bit.0xspryon.work`) && PathPrefix(`/api`)
      - traefik.http.routers.bit-staging-api.priority=100
      - traefik.http.routers.bit-staging-api.entrypoints=websecure
      - traefik.http.routers.bit-staging-api.tls.certresolver=letsencrypt
      - traefik.http.services.bit-staging-api.loadbalancer.server.port=3000
    depends_on:
      migrations:
        condition: service_completed_successfully
      seeds:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # Catch-all for the origin: everything Traefik did not match against the
      # api's `/api` prefix above is an SPA route and resolves to the shell.
      # No `env_file` and no runtime config — the bundle is static bytes, fixed
      # at build time.
      - traefik.enable=true
      - traefik.http.routers.bit-staging-web.rule=Host(`bit.0xspryon.work`)
      - traefik.http.routers.bit-staging-web.priority=1
      - traefik.http.routers.bit-staging-web.entrypoints=websecure
      - traefik.http.routers.bit-staging-web.tls.certresolver=letsencrypt
      - traefik.http.services.bit-staging-web.loadbalancer.server.port=80

volumes:
  postgres_data:
  tei_data:
  reranker_data:

networks:
  dokploy-network:
    external: true
