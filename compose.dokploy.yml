name: bit-staging

x-app-env: &app-env
  NODE_ENV: production
  ENVIRONMENT: staging

services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--auto-truncate"
    environment:
      - HF_HOME=/data
    volumes:
      - tei_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--auto-truncate"
    environment:
      - HF_HOME=/data
    volumes:
      - reranker_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  migrations:
    build:
      context: .
      dockerfile: ./Dockerfile.migrations.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
    networks:
      - dokploy-network

  seeds:
    build:
      context: .
      dockerfile: ./Dockerfile.seeds.production
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
      EMBEDDING_ENDPOINT: http://embeddings:80
      RERANK_ENDPOINT: http://reranker:80
    networks:
      - dokploy-network
    depends_on:
      migrations:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      EMBEDDING_ENDPOINT: http://embeddings:80
      RERANK_ENDPOINT: http://reranker:80
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      # The api and the SPA share ONE public origin, and that is load-bearing
      # rather than tidy: the browser client calls relative `/api/v1/*` URLs,
      # and better-auth issues first-party session cookies plus post-login
      # redirects to `/connect` and `/admin/users` — SPA routes. Split them
      # across two hostnames and every one of those breaks at once.
      #
      # Traefik orders routers by descending priority, and defaults priority to
      # the rule's length, which already favours this router over the SPA's bare
      # Host rule. Both are pinned explicitly so the split never turns on how
      # long a hostname happens to be.
      - traefik.enable=true
      - traefik.http.routers.bit-staging-api.rule=Host(`bit.0xspryon.work`) && PathPrefix(`/api`)
      - traefik.http.routers.bit-staging-api.priority=100
      - traefik.http.routers.bit-staging-api.entrypoints=websecure
      - traefik.http.routers.bit-staging-api.tls.certresolver=letsencrypt
      - traefik.http.services.bit-staging-api.loadbalancer.server.port=3000
    depends_on:
      migrations:
        condition: service_completed_successfully
      seeds:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # Catch-all for the origin: everything Traefik did not match against the
      # api's `/api` prefix above is an SPA route and resolves to the shell.
      # No `env_file` and no runtime config — the bundle is static bytes, fixed
      # at build time.
      - traefik.enable=true
      - traefik.http.routers.bit-staging-web.rule=Host(`bit.0xspryon.work`)
      - traefik.http.routers.bit-staging-web.priority=1
      - traefik.http.routers.bit-staging-web.entrypoints=websecure
      - traefik.http.routers.bit-staging-web.tls.certresolver=letsencrypt
      - traefik.http.services.bit-staging-web.loadbalancer.server.port=80

  # Drizzle Gateway: a browser UI onto the production database, same pattern as
  # poppynz. Unlike `drizzle-kit studio` this is a self-hosted server with its
  # own login, which is the only reason it is safe to give a public hostname —
  # MASTERPASS is the sole thing between the internet and full read/write access
  # to every row. Give it a generated secret, never a shared or reused one.
  drizzle-gate:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: always
    # Deliberately NO `env_file`. Compose still reads `.env` to interpolate the
    # two variables below, but pulling the whole file in would hand this
    # container BETTER_AUTH_SECRET, DISCORD_CLIENT_SECRET and the database
    # credentials — none of which it needs, since connections are configured
    # through its own UI and persisted to the volume.
    environment:
      PORT: 3000
      STORE_PATH: ${DRIZZLE_GATEWAY_STORE_PATH:-/app/data}
      # `:?` makes compose REFUSE to start without a master password. The
      # alternative is worse than a failed deploy: an unset value would bring up
      # an unauthenticated database console on a public hostname.
      MASTERPASS: ${DRIZZLE_GATEWAY_MASTERPASS:?set a master password before deploying the gateway}
    expose:
      - "3000"
    networks:
      - dokploy-network
    volumes:
      # Saved connections and gateway state. On a named volume so a redeploy
      # does not drop every configured database.
      - drizzle-gateway:${DRIZZLE_GATEWAY_STORE_PATH:-/app/data}
    labels:
      # HTTP basic auth in FRONT of the gateway, so an unauthenticated request
      # never reaches the application at all. The gateway's own MASTERPASS stays
      # in place behind it — the two are independent, and losing either one still
      # leaves a lock on the door.
      #
      # The htpasswd entry is `user:bcrypt-hash`, supplied through the
      # environment rather than written here. That keeps the hash out of the
      # repository and sidesteps compose's `$` interpolation: a bcrypt hash is
      # full of `$`, and inline it would have to be escaped as `$$`.
      - traefik.enable=true
      - traefik.http.routers.bit-staging-db.rule=Host(`drizzle.bit.0xspryon.work`)
      - traefik.http.routers.bit-staging-db.entrypoints=websecure
      - traefik.http.routers.bit-staging-db.tls.certresolver=letsencrypt
      - traefik.http.routers.bit-staging-db.middlewares=bit-staging-db-auth
      - traefik.http.middlewares.bit-staging-db-auth.basicauth.users=${DRIZZLE_GATEWAY_BASIC_AUTH:?set the htpasswd entry guarding the gateway}
      - traefik.http.services.bit-staging-db.loadbalancer.server.port=3000

volumes:
  drizzle-gateway:
  tei_data:
  reranker_data:

networks:
  dokploy-network:
    external: true
